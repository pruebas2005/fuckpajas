<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="apple-touch-icon" href="logo.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FUCKPAJA">
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUCKPAJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="colum">

            <h1>FUCKPAJA</h1>
            <div>
                <a href="index.html">Inicio</a>|
                <a href="ranking.html">Ranking</a>|
                <a href="url.html">Comentarios</a>
                <!-- <a href="contacto.html">Contacto</a>-->
            </div>
        </div>
    </header>

    <main>
        <fieldset>
            <legend>Total acumuladas </legend>
            <div class="colum">

                <div class="center">
                    <label><input type="radio" name="opcion1" value="">Todas</label>
                    <label><input type="radio" name="opcion1" value="deslechada">Deslechada</label>
                    <label><input type="radio" name="opcion1" value="copulacion">Copulacion</label>
                    <label><input type="radio" name="opcion1" value="no_contesta">Otra</label>
                </div>
                <div>
                    <button id="actualizar">Actualizar</button>
                </div>
            </div>
            <hr>
            <div class="center" id="ranking-total">
            </div>
        </fieldset>

        <fieldset>
            <legend>Mes</legend>
            <div class="colum">
                <div>
                    <label for="mes">
                        Introduce el mes:
                        <input type="month" id="mes" name="mes">
                    </label>
                </div>

                <div>
                    <label><input type="radio" name="opcion2" value="">Todas</label>
                    <label><input type="radio" name="opcion2" value="deslechada">Deslechada</label>
                    <label><input type="radio" name="opcion2" value="copulacion">Copulacion</label>
                    <label><input type="radio" name="opcion2" value="no_contesta">Otra</label>
                </div>

                <div>
                    <button id="actualizar2">Actualizar</button>
                </div>
            </div>

            <hr>
            <div class="center" id="ranking-mes">
            </div>

        </fieldset>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app2.js"></script>
</body>

</html>
