<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="apple-touch-icon" href="logo.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FUCKPAJA">
    <link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUCKPAJA</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="colum">
            <h1>FUCKPAJA</h1>
            <div class="contenedor-menu">
                <a href="index.html">Inicio</a>
                <span class="separador">|</span>
                <a href="ranking.html">Ranking</a>
                <span class="separador">|</span>
                <a href="url.html">Muro</a>
            </div>
        </div>
    </header>

    <main>
        <form id="formulario-colegas">
            <div class="grupo-input">
                <label for="name">Nombre:</label>
                <select id="name" name="name" required>
                    <option value="" disabled selected>Selecciona tu nombre</option>
                    <option value="jaime">jaime</option>
                    <option value="Raul">Raul</option>
                    <option value="Alejandro">Alejandro</option>
                    <option value="Antonio">Antonio</option>
                    <option value="Juan">Juan</option>
                    <option value="Pedro">Pedro</option>
                    <option value="Josema">Josema</option>
                </select>
                <label for="url">Comentarios:</label>
                <input type="text" id="url" name="url"
                    placeholder="Añade tu video caballero o cualquier comentraio al respecto">
            </div>

            <div class="grupo-radio">
                <label><input name="opcion" value="deslechada" type="radio" required> Deslechada</label>
                <label><input name="opcion" value="copulacion" type="radio"> Copulación</label>
                <label><input name="opcion" value="no_contesta" type="radio"> No contesta</label>
            </div>

            <button type="submit" id="sumar">+1 Al Marcador</button>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>

</html>
