    <main>
        <form id="formulario-colegas">
            <div class="grupo-input">
                <label for="name">Nombre:</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre deslechado" required>
                <label for="url">URL:</label>
                <input type="url" id="url" name="url" placeholder="Tu video caballero">
            </div>

            <div class="grupo-radio">
                <label><input name="opcion" value="deslechada" type="radio" required> Deslechada</label>
                <label><input name="opcion" value="copulacion" type="radio"> Copulación</label>
                <label><input name="opcion" value="no_contesta" type="radio"> No contesta</label>
            </div>

            <button type="submit" id="sumar">+1 Al Marcador</button>
        </form>
    </main>
